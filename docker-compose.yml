services:
  lark-bot:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: lark-daily-bot

    restart: unless-stopped

    environment:
      DATABASE_PATH: /app/data/lark-bot.db  
      LARK_APP_SECRET: ${LARK_APP_SECRET} 
      LARK_REPORT_CHAT_ID: ${LARK_REPORT_CHAT_ID}
      LARK_APP_ID: ${LARK_APP_ID}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MISTRAL_API: ${MISTRAL_API}

      # Identifiant Lark de la DRH. Sans lui, la reconnaissance retombe sur
      # le libelle du profil, qui peut etre maquille.
      LARK_RH_OPEN_ID: ${LARK_RH_OPEN_ID:-}
      TZ: Africa/Douala

      # Interface de consultation. Sans secret, elle ne demarre pas.
      INTERFACE_TOKEN: ${INTERFACE_TOKEN:-}
      INTERFACE_PORT: 47821
      INTERFACE_BIND: 0.0.0.0

    # Accessible directement depuis un navigateur, choix assume. Le jeton
    # circule en clair en HTTP : il est lisible dans le trafic et dans les
    # logs d un intermediaire. Remettre "127.0.0.1:47821:47821" pour
    # restreindre l acces a un tunnel SSH.
    ports:
      - "47821:47821"

    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads